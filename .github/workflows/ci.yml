name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore ./backend/TicTacToe.sln

    - name: Build backend
      run: dotnet build ./backend/TicTacToe.sln --configuration Release --no-restore

    - name: Run backend tests
      run: dotnet test ./backend/TicTacToe.sln --configuration Release --no-restore --verbosity normal

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: npm --prefix ./frontend install

    - name: Build frontend
      run: npm --prefix ./frontend run build

    # Upload Backend Build Artifact
    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-backend
        path: ./backend/bin/Release/

    # Upload Frontend Build Artifact
    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: angular-frontend
        path: ./frontend/dist/
